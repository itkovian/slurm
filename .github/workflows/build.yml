name: slurm C/C++ build

on:
  push:
    branches: [22.05.ug, 23.02.ug, 24.05.ug]
  pull_request:
    branches: [22.05.ug, 23.02.ug, 24.05.ug]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4.2.2
      - name: configure
        run: ./configure --enable-multiple-slurmd --prefix=/tmp/slurm/
      - name: make
        run: make -j
      - name: make check
        run: make -j check
      - name: make install
        run: make -j install
